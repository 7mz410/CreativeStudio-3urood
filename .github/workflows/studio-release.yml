# Creative Studio release for 3urood: a tag push (v0.0.2-test, v0.1.0, ...) builds the unsigned
# packages for macOS, Windows and Linux through rsm's reusable build-release.yml. A tag with a '-'
# is a pre-release. Kept apart from upstream's release.yml so merges stay clean.
name: Studio release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release 3urood
    permissions:
      contents: write
    uses: 7mz410/CreativeStudio-rsm/.github/workflows/build-release.yml@main
    with:
      app: 3urood
      package: deckcraft
      version_var: DECKCRAFT_VERSION
      bundle: DeckCraft.app
      tag: ${{ github.ref_name }}
